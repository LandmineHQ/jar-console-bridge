name: Release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "GitHub Actions run ID containing server_jar and server_linux_x64 artifacts"
        required: true
        type: string
      version:
        description: "Release version or tag, for example v1.0.0"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish jar and native binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            echo "build_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a semantic version, for example v1.0.0 or 1.0.0-rc.1." >&2
            exit 1
          fi

      - name: Validate build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          STATUS="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          CONCLUSION="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          HEAD_SHA="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"

          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "Build run $BUILD_ID is not a successful completed run." >&2
            echo "status=$STATUS conclusion=$CONCLUSION" >&2
            exit 1
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download server.jar
        uses: actions/download-artifact@v8
        with:
          name: server_jar
          path: release-assets/java
          run-id: ${{ inputs.build_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download native binary
        uses: actions/download-artifact@v8
        with:
          name: server_linux_x64
          path: release-assets/native
          run-id: ${{ inputs.build_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Prepare release assets
        id: assets
        run: |
          JAR_SOURCE="release-assets/java/server.jar"
          BINARY_SOURCE="release-assets/native/server"
          CHECKSUM_ASSET="release-assets/SHA256SUMS"

          test -f "$JAR_SOURCE"
          test -f "$BINARY_SOURCE"

          JAR_HASH="$(sha256sum "$JAR_SOURCE" | awk '{print $1}')"
          BINARY_HASH="$(sha256sum "$BINARY_SOURCE" | awk '{print $1}')"
          JAR_ASSET="release-assets/server_jar__${JAR_HASH}.jar"
          BINARY_ASSET="release-assets/server_linux_x64__${BINARY_HASH}"

          mv "$JAR_SOURCE" "$JAR_ASSET"
          mv "$BINARY_SOURCE" "$BINARY_ASSET"
          chmod +x "$BINARY_ASSET"

          {
            echo "$JAR_HASH  $(basename "$JAR_ASSET")"
            echo "$BINARY_HASH  $(basename "$BINARY_ASSET")"
          } > "$CHECKSUM_ASSET"

          {
            echo "jar=$JAR_ASSET"
            echo "binary=$BINARY_ASSET"
            echo "checksums=$CHECKSUM_ASSET"
            echo "jar_name=$(basename "$JAR_ASSET")"
            echo "binary_name=$(basename "$BINARY_ASSET")"
            echo "jar_hash=$JAR_HASH"
            echo "binary_hash=$BINARY_HASH"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          JAR_ASSET: ${{ steps.assets.outputs.jar }}
          BINARY_ASSET: ${{ steps.assets.outputs.binary }}
          CHECKSUM_ASSET: ${{ steps.assets.outputs.checksums }}
          HEAD_SHA: ${{ steps.build.outputs.head_sha }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Adding build assets."
            gh release upload "$VERSION" \
              "$JAR_ASSET" "$BINARY_ASSET" "$CHECKSUM_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Release $VERSION does not exist. Creating a draft release."
            gh release create "$VERSION" \
              "$JAR_ASSET" "$BINARY_ASSET" "$CHECKSUM_ASSET" \
              --draft \
              --title "$VERSION" \
              --target "$HEAD_SHA" \
              --generate-notes
          fi

      - name: Write release information
        run: |
          {
            echo "## Release"
            echo
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Build ID: \`${{ inputs.build_id }}\`"
            echo "- Java asset: \`${{ steps.assets.outputs.jar_name }}\`"
            echo "- Native asset: \`${{ steps.assets.outputs.binary_name }}\`"
            echo "- Checksums: \`SHA256SUMS\`"
            echo "- Java SHA-256: \`${{ steps.assets.outputs.jar_hash }}\`"
            echo "- Native SHA-256: \`${{ steps.assets.outputs.binary_hash }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
