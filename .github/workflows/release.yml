name: Release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "GitHub Actions run ID containing server-jar and hash-named native artifacts"
        required: true
        type: string
      version:
        description: "Release version or tag, for example v1.0.0"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish jar and native binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate inputs
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$BUILD_ID" =~ ^[0-9]+$ ]]; then
            echo "build_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a semantic version, for example v1.0.0 or 1.0.0-rc.1." >&2
            exit 1
          fi

      - name: Validate build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          STATUS="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
          CONCLUSION="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          HEAD_SHA="$(gh run view "$BUILD_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"

          if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
            echo "Build run $BUILD_ID is not a successful completed run." >&2
            echo "status=$STATUS conclusion=$CONCLUSION" >&2
            exit 1
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download server.jar
        uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: release-assets/java
          run-id: ${{ inputs.build_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download native binary
        uses: actions/download-artifact@v8
        with:
          pattern: server_linux-x64__*
          path: release-assets/native
          merge-multiple: true
          run-id: ${{ inputs.build_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Prepare release assets
        id: assets
        env:
          BUILD_ID: ${{ inputs.build_id }}
          VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
        run: |
          JAR_SOURCE="release-assets/java/server.jar"
          BINARY_ASSET="$(find release-assets/native -maxdepth 1 -type f -name 'server_linux-x64__*' -print -quit)"
          test -f "$JAR_SOURCE"
          test -n "$BINARY_ASSET"

          BINARY_NAME="$(basename "$BINARY_ASSET")"
          FILENAME_HASH="${BINARY_NAME##*__}"
          if [[ ! "$FILENAME_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "native artifact does not have a valid SHA-256 suffix: $BINARY_NAME" >&2
            exit 1
          fi

          ACTUAL_HASH="$(sha256sum "$BINARY_ASSET" | awk '{print $1}')"
          if [[ "$FILENAME_HASH" != "$ACTUAL_HASH" ]]; then
            echo "native artifact hash does not match its filename." >&2
            echo "filename=$FILENAME_HASH actual=$ACTUAL_HASH" >&2
            exit 1
          fi

          ASSET_PREFIX="jar-console-bridge-${VERSION}-build-${BUILD_ID}-${SHORT_SHA}"
          JAR_ASSET="release-assets/${ASSET_PREFIX}.jar"

          mv "$JAR_SOURCE" "$JAR_ASSET"
          chmod +x "$BINARY_ASSET"

          {
            echo "jar=$JAR_ASSET"
            echo "binary=$BINARY_ASSET"
            echo "binary_name=$BINARY_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          JAR_ASSET: ${{ steps.assets.outputs.jar }}
          BINARY_ASSET: ${{ steps.assets.outputs.binary }}
          HEAD_SHA: ${{ steps.build.outputs.head_sha }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Adding build assets."
            gh release upload "$VERSION" "$JAR_ASSET" "$BINARY_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Release $VERSION does not exist. Creating a draft release."
            gh release create "$VERSION" "$JAR_ASSET" "$BINARY_ASSET" \
              --draft \
              --title "$VERSION" \
              --target "$HEAD_SHA" \
              --generate-notes
          fi

      - name: Write release information
        run: |
          {
            echo "## Release"
            echo
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Build ID: \`${{ inputs.build_id }}\`"
            echo "- Java asset: \`${{ steps.assets.outputs.jar }}\`"
            echo "- Native asset: \`${{ steps.assets.outputs.binary_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
